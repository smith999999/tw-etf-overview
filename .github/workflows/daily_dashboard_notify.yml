name: Daily Dashboard Telegram Notify

# 由 Claude 每日更新儀表板的排程任務在發布完成後觸發（也可手動執行測試）。
# 不再使用 GitHub 定時排程：它常延遲數小時。台灣時間週日不發送。
on:
  workflow_dispatch:
    inputs:
      status:
        description: 'updated / failed（留空則只送連結）'
        required: false
        default: ''
      stance:
        description: '整體判讀（偏多／中性／偏空）'
        required: false
        default: ''
      headline:
        description: '一句話重點'
        required: false
        default: ''
      data_as_of:
        description: '行情截至哪一天'
        required: false
        default: ''
      force:
        description: '週日也發送（測試用）'
        required: false
        default: 'false'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ inputs.status }}
          STANCE: ${{ inputs.stance }}
          HEADLINE: ${{ inputs.headline }}
          DATA_AS_OF: ${{ inputs.data_as_of }}
          FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/dashboard_notify.py
