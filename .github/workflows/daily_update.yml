name: Daily ETF Data Update

on:
  schedule:
    # 每天台灣時間下午 4:30 執行 (UTC 時間早上 8:30)
    # 此時台股已收盤，投信與 MoneyDJ 通常已更新當日淨值與持股資訊
    - cron: '30 8 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 確保能抓到歷史紀錄以進行比對

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance python-dateutil

      - name: Run NAV Scraper
        run: python scraper/update_nav.py

      - name: Run Holdings Scraper
        run: python scraper/update_holdings.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/live_nav.json public/live_holdings.json
          # 如果資料有更新則 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update ETF NAV and Holdings [skip ci]" && git push)
